function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function closeM(id){document.getElementById(id).classList.remove('open')} function showSetup(){setupBox.classList.remove('hidden');loginBox.classList.add('hidden')} function showLogin(){setupBox.classList.add('hidden');loginBox.classList.remove('hidden')}
async function init(){if(!window.SUPABASE_URL||SUPABASE_URL.includes('YOUR_')){authMsg.textContent='config.js에 Supabase URL과 anon key를 입력하세요.';return} sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY); const r=await sb.auth.getSession(); if(r.data.session) await enter(r.data.session.user)}
async function UNUSED_login(){authMsg.textContent='';let r=await sb.auth.signInWithPassword({email:email.value,password:pw.value});if(r.error) return authMsg.textContent=r.error.message;await enter(r.data.user)}

async function UNUSED_bootstrapAdmin(){authMsg.textContent='';try{let r=await fetch(`${SUPABASE_URL}/functions/v1/bootstrap-admin`,{method:'POST',headers:{'Content-Type':'application/json','apikey':SUPABASE_ANON_KEY},body:JSON.stringify({email:setupEmail.value,password:setupPw.value,pin:setupPin.value})});let j=await r.json();if(!r.ok)throw Error(j.error||'생성 실패');authMsg.textContent='관리자가 생성되었습니다. 로그인하세요.';showLogin()}catch(e){authMsg.textContent=e.message}}

async function adminLoginFn(){authMsg.textContent='';if(!sb){authMsg.textContent='아직 Supabase 연결 전입니다. config.js 설정 후 PIN 로그인이 활성화됩니다.';return}if(!adminPin.value){authMsg.textContent='관리자 PIN을 입력하세요.';return}try{let r=await sb.auth.signInWithPassword({email:window.ADMIN_LOGIN_EMAIL,password:adminPin.value});if(r.error)return authMsg.textContent='PIN이 올바르지 않거나 관리자 계정 설정이 완료되지 않았습니다.';await enter(r.data.user)}catch(e){authMsg.textContent='로그인 연결 오류: '+e.message}}
async function dealerLoginFn(){authMsg.textContent='';if(!sb){authMsg.textContent='아직 Supabase 연결 전입니다. config.js 설정 후 대리점 로그인이 활성화됩니다.';return}let email=(dealerCode.value||'').trim().toLowerCase()+'@dealer.fursys-tracker.local';let r=await sb.auth.signInWithPassword({email,password:dealerPin.value});if(r.error)return authMsg.textContent='대리점 ID 또는 PIN이 올바르지 않습니다.';await enter(r.data.user)}
async function enter(user){me=user;let r=await sb.from('profiles').select('*').eq('id',user.id).single();if(r.error){await sb.auth.signOut();return authMsg.textContent='권한 프로필이 없습니다. 관리자에게 문의하세요.'}profile=r.data;authView.classList.add('hidden');app.classList.remove('hidden');who.textContent=`${profile.display_name||user.email} · ${profile.role}`;usersBtn.classList.toggle('hidden',profile.role!=='admin');addBtn.classList.toggle('hidden',profile.role!=='admin');document.querySelector('.hero p').textContent=profile.role==='dealer'?'배정받은 신규거래처의 진행상황과 영업 히스토리를 기록합니다.':'공개정보 발굴 → 내부거래 조회 → 대리점 배정 → 컨택 → 견적 → 수주/보류/제외까지 본사에서 통합 관리합니다.';await loadLeads()}
async function loadLeads(){let r=await sb.from('companies').select('*').order('updated_at',{ascending:false});if(r.error)return alert('거래처 데이터 조회 오류: '+r.error.message);leads=r.data||[];render()}
function render(){let q=document.getElementById('q').value.toLowerCase(),s=document.getElementById('status').value;let a=leads.filter(x=>(s==='all'||x.status===s)&&JSON.stringify(x).toLowerCase().includes(q));document.getElementById('rows').innerHTML=a.map(x=>`<tr><td><div class="name">${esc(x.name)}</div><div class="muted">${esc(x.biz||'')}</div></td><td><span class="badge ${x.status}">${labels[x.status]||x.status}</span></td><td>${esc(x.period)}</td><td>${esc(x.region)}</td><td>${esc(x.people)}</td><td>${esc(x.project)}</td><td>${esc(x.dealer)}</td><td>${esc(x.owner_name)}</td><td>${esc(x.last_contact||'')}</td><td>${esc(x.next_action_date||'')}</td><td><button class="secondary" onclick="detail('${x.id}')">설명</button></td><td><button class="secondary" onclick="detail('${x.id}')">보기</button></td><td><button class="secondary" onclick="editLead('${x.id}')">수정</button></td></tr>`).join('')}
function openLead(){leadForm.reset();leadForm.id.value='';leadTitle.textContent='신규 거래처 추가';leadModal.classList.add('open')}
function editLead(id){if(profile.role==='viewer')return;let x=leads.find(v=>v.id===id);leadForm.reset();for(let k of ['id','name','biz','status','period','region','people','project','dealer','owner_name','last_contact','next_action_date','reason','next_action','dealer_visible']) if(leadForm.elements[k]) leadForm.elements[k].value=x[k]||'';leadTitle.textContent='거래처 수정';leadModal.classList.add('open')}
async function saveLead(e){e.preventDefault();if(profile.role==='viewer')return;let f=Object.fromEntries(new FormData(leadForm).entries());let id=f.id;delete f.id;for(const k of ['last_contact','next_action_date']){if(!f[k])f[k]=null;}f.dealer_visible=f.dealer_visible==='true';f.updated_by=me.id;if(id){let r=await sb.from('companies').update(f).eq('id',id);if(r.error)return alert(r.error.message)}else{f.created_by=me.id;let r=await sb.from('companies').insert(f);if(r.error)return alert(r.error.message)}closeM('leadModal');await loadLeads()}
async function detail(id){currentId=id;let x=leads.find(v=>v.id===id);dTitle.textContent=x.name;dSub.textContent=[x.biz,x.region,x.project].filter(Boolean).join(' · ');let r=await sb.from('history').select('*,profiles(display_name)').eq('company_id',id).order('event_date',{ascending:false}).order('created_at',{ascending:false});let hs=r.data||[];dBody.innerHTML=`<h3>판단 / 발굴 이유</h3><p>${esc(x.reason||'-')}</p><h3>Next Action</h3><p>${esc(x.next_action||'-')}</p><h3>History</h3>${hs.length?hs.map(h=>`<div class="history-row"><div class="muted">${esc(h.event_date||'')}<br>${esc(h.event_type||'')}</div><div>${esc(h.content)}<div class="muted">${esc(h.profiles?.display_name||'')}</div></div></div>`).join(''):'<p class="muted">기록 없음</p>'}`;historyEditor.classList.toggle('hidden',profile.role==='viewer');detailModal.classList.add('open')}
async function addHistory(){if(!hText.value.trim())return;let r=await sb.from('history').insert({company_id:currentId,event_date:hDate.value||new Date().toISOString().slice(0,10),event_type:hType.value,content:hText.value.trim(),created_by:me.id});if(r.error)return alert(r.error.message);await sb.from('companies').update({last_contact:hDate.value||new Date().toISOString().slice(0,10),updated_by:me.id}).eq('id',currentId);hText.value='';await loadLeads();await detail(currentId)}
async function openUsers(){if(profile.role!=='admin')return;usersModal.classList.add('open');await listUsers()}
async function listUsers(){let r=await sb.from('dealer_accounts').select('*').order('dealer_name');userList.innerHTML=(r.data||[]).map(u=>`<div class="history-row"><div>${u.is_active?'활성':'중지'}</div><div><b>${esc(u.dealer_name)}</b><div class="muted">ID: ${esc(u.dealer_code)} · PIN은 보안상 다시 표시하지 않음</div></div></div>`).join('')}
async function createDealer(){try{let token=(await sb.auth.getSession()).data.session.access_token;let r=await fetch(`${SUPABASE_URL}/functions/v1/admin-dealers`,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token,'apikey':SUPABASE_ANON_KEY},body:JSON.stringify({dealer_name:newDealerName.value,dealer_code:newDealerCode.value,pin:newDealerPin.value})});let j=await r.json();if(!r.ok)throw Error(j.error||'실패');newDealerName.value=newDealerCode.value=newDealerPin.value='';await listUsers();alert('대리점 계정을 생성했습니다.')}catch(e){alert(e.message)}}
async function seedData(auto=false){if(profile.role!=='admin')return;let c=await sb.from('companies').select('id',{count:'exact',head:true});if(c.error)return alert('DB 확인 중 오류: '+c.error.message);if(c.count>0){if(!auto)alert('이미 데이터가 있습니다.');return}try{for(const x of SEED){let events=x.events||[];let payload={name:x.name,biz:x.biz,status:x.status,period:x.period,region:x.region,people:x.people,project:x.project,reason:x.reason,next_action:x.next,dealer:x.dealer||'',created_by:me.id,updated_by:me.id};let r=await sb.from('companies').insert(payload).select('id').single();if(r.error)throw Error(r.error.message);if(events.length){let hr=await sb.from('history').insert(events.map(e=>({company_id:r.data.id,event_date:null,event_type:e[0],content:e[1],created_by:me.id})));if(hr.error)throw Error(hr.error.message)}}let r=await sb.from('companies').select('*').order('updated_at',{ascending:false});if(r.error)throw Error(r.error.message);leads=r.data||[];render()}catch(e){alert('초기 데이터 저장 중 오류: '+e.message)}}
init();
</script></body></html>
